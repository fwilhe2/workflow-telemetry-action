# TEMPORARY. Probes what open process-tracing tooling is available on the
# runners, so the replacement for the old closed-source eBPF binary can be
# designed against real output on both architectures. Delete once done.
name: Probe tracers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install forkstat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq forkstat >/dev/null
          echo "arch: $(uname -m)"
          dpkg-query -Wf '${Version} ${Installed-Size}kB\n' forkstat

      - name: forkstat options
        run: forkstat -h 2>&1 | head -40 || true

      - name: fork event shape, long args, nonzero exit, truncation
        run: |
          sudo timeout 8 forkstat -e fork,exec,exit -x >/tmp/f.txt 2>&1 &
          sleep 1
          /bin/echo aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa bbbbbbbbbbbbbbbbbbbbbbbbbbbbbb cccccccccccccccccccccccccccccc dddddddddddddddddddddddddddddd eeeeeeeeeeeeeeeeeeeeeeeeeeeeee >/dev/null
          /bin/sh -c 'exit 3' || true
          /bin/sh -c 'exit 42' || true
          node -e "process.exit(7)" || true
          sleep 6
          echo "----- fork/exec/exit -----"
          grep -E "echo|sh -c|node -e|fork" /tmp/f.txt | head -30
          echo "----- header -----"
          head -1 /tmp/f.txt

      - name: numeric uid and no-tty variants
        run: |
          # -X or similar for numeric uid? try documented short opts.
          for opt in "-x" "-x -l"; do
            echo "== forkstat $opt =="
            sudo timeout 4 forkstat -e exec $opt >/tmp/o.txt 2>&1 &
            sleep 1
            /bin/echo probe >/dev/null
            sleep 3.5
            head -3 /tmp/o.txt
          done
