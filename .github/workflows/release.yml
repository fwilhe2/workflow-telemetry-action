# Tags and releases whatever version is currently in package.json, moves the
# major tag (v3) that users reference with `uses: ...@v3`, and advances that
# major's release branch (releases/v3).
#
# Run it from the ref you want to release: `main` for the current major, or
# `releases/vN` to ship a fix for an older one.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve the version and check the tag, but publish nothing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # A release must never ship a dist/ that does not match src/.
      - name: Verify dist/ is up to date
        run: |
          npm run package
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date, run 'npm run all' and commit"
            git --no-pager diff --stat dist/
            exit 1
          fi

      - name: Test
        run: |
          npm run ci-test
          npm run smoke-test

      - name: Resolve version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -z "$version" ]; then
            echo "::error::could not read version from package.json"
            exit 1
          fi
          major="v${version%%.*}"
          # Only the newest release in the repository may be marked "Latest".
          # Releasing a fix for an older major must not steal that label from a
          # newer one, so compare against every version tag that already exists.
          highest=$(
            {
              git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
              echo "v$version"
            } | sort -V | tail -1
          )
          if [ "$highest" = "v$version" ]; then
            make_latest=true
          else
            make_latest=false
          fi
          {
            echo "version=v$version"
            echo "major=$major"
            echo "branch=releases/$major"
            echo "make_latest=$make_latest"
          } >>"$GITHUB_OUTPUT"
          echo "Releasing v$version from ${{ github.ref_name }}"
          echo "  major tag:      $major"
          echo "  release branch: releases/$major"
          echo "  marked latest:  $make_latest"

      - name: Check the tag is free
        run: |
          if git ls-remote --exit-code --tags origin \
              "refs/tags/${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::error::tag ${{ steps.version.outputs.version }} already exists, bump the version in package.json"
            exit 1
          fi

      # The release branch only ever moves forward. If it holds work that the
      # ref being released does not, the push would silently drop it, so stop
      # here instead — before anything has been published.
      - name: Check the release branch can move forward
        run: |
          branch="${{ steps.version.outputs.branch }}"
          if ! git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "$branch does not exist yet and will be created at $(git rev-parse --short HEAD)"
            exit 0
          fi
          git fetch --no-tags origin \
            "+refs/heads/$branch:refs/remotes/origin/$branch"
          if git merge-base --is-ancestor "refs/remotes/origin/$branch" HEAD; then
            echo "$branch will fast-forward to $(git rev-parse --short HEAD)"
          else
            echo "::error::$branch has commits that are not in ${{ github.ref_name }}; merge or cherry-pick them first, or release from $branch"
            git --no-pager log --oneline "HEAD..refs/remotes/origin/$branch"
            exit 1
          fi

      - name: Tag and update the release branch
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" \
            -m "${{ steps.version.outputs.version }}"
          # The major tag moves to each new release.
          git tag -f "${{ steps.version.outputs.major }}" \
            -m "${{ steps.version.outputs.major }}"
          # Pushed first, and without --force: it is the only push that can
          # still be rejected, and nothing is published if it is.
          git push origin "HEAD:refs/heads/${{ steps.version.outputs.branch }}"
          git push origin "${{ steps.version.outputs.version }}"
          git push -f origin "${{ steps.version.outputs.major }}"

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.version.outputs.version }}',
              name: '${{ steps.version.outputs.version }}',
              generate_release_notes: true,
              draft: false,
              prerelease: false,
              make_latest: '${{ steps.version.outputs.make_latest }}'
            })
