name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Check the Node version is declared consistently
        id: npm-check-node-version
        run: npm run check:node-version

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

      - name: Smoke Test the Bundles
        id: npm-smoke-test
        run: npm run smoke-test

  # `proc_trace_enable: false` must skip the forkstat install entirely, which
  # is the whole point of the input: it is the only part of the action that
  # needs sudo and costs setup time.
  test-action-no-proc-trace:
    name: GitHub Actions Test (no process tracing)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm forkstat is not already present
        run: |
          if command -v forkstat >/dev/null; then
            echo "::error::forkstat is preinstalled, this test cannot prove anything"
            exit 1
          fi

      - name: Collect telemetry without process tracing
        uses: ./
        with:
          comment_on_pr: false
          proc_trace_enable: false

      - name: Do some work
        run: sha256sum /etc/hostname

      - name: Verify nothing was installed and no trace was taken
        run: |
          if command -v forkstat >/dev/null; then
            echo "::error::forkstat was installed despite proc_trace_enable: false"
            exit 1
          fi
          if [ -e /tmp/proc-trace.out ]; then
            echo "::error::a process trace was written despite proc_trace_enable: false"
            exit 1
          fi
          echo "no install, no trace - resource metrics only"

  # Runs the action on itself, so a release cannot ship a dist/ bundle that
  # builds but blows up inside a real workflow.
  #
  # The two legs render differently on purpose: arm64 asks for `sparkline`,
  # which is not the default and would otherwise only ever run in the unit
  # tests. Which arch gets which is arbitrary — that both run every time is not.
  # The job above passes no `charts` input at all, which is what covers the
  # third case, an unset input falling back to `mermaid`.
  test-action:
    name: GitHub Actions Test (${{ matrix.arch }}, ${{ matrix.charts }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
            charts: mermaid
          - runner: ubuntu-24.04-arm
            arch: arm64
            charts: sparkline
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect telemetry for this job
        id: test-action
        uses: ./
        with:
          comment_on_pr: false
          proc_trace_table_show: true
          charts: ${{ matrix.charts }}

      - name: Do some work worth measuring
        id: workload
        run: |
          dd if=/dev/zero of=/tmp/blob bs=1M count=256
          sha256sum /tmp/blob
          rm /tmp/blob
          /bin/sh -c 'exit 3' || true

      # Proves the process tracer is really capturing on this architecture,
      # rather than silently degrading to an empty trace the way the old
      # prebuilt binaries did.
      - name: Verify the process tracer captured something
        id: verify-trace
        run: |
          trace=/tmp/proc-trace.out
          if [ ! -s "$trace" ]; then
            echo "::error::process trace $trace is missing or empty"
            exit 1
          fi
          echo "trace lines: $(wc -l <"$trace")"
          for event in fork exec exit; do
            n=$(grep -c " $event " "$trace" || true)
            echo "$event events: $n"
            if [ "$n" -eq 0 ]; then
              echo "::error::no $event events captured"
              exit 1
            fi
          done
          echo "--- sample ---"
          grep " exec \| exit " "$trace" | head -5
          # The workload above must show up in the trace.
          if ! grep -q "sha256sum" "$trace"; then
            echo "::error::workload command not found in trace"
            exit 1
          fi
          echo "workload commands found in trace"
