name: 'Workflow Telemetry'
description: 'Workflow Telemetry'
author: 'Florian Wilhelm'
inputs:
  github_token:
    description: 'GitHub API Access Token'
    default: ${{ github.token }}
    required: false
  charts:
    description:
      "How the traces and metrics are drawn. 'sparkline' renders them as text —
      Unicode block characters in a markdown table — which costs the page
      nothing. 'mermaid' renders them as diagrams, each of which GitHub loads in
      its own iframe; a summary page holding a matrix worth of those is slow to
      the point of being unusable, so prefer it for a single job under
      investigation. Defaults to 'sparkline'."
    default: 'sparkline'
    required: false
  metric_frequency:
    description:
      "Metric collection frequency in seconds. Must be a number. Defaults to
      '5'."
    default: '5'
    required: false
  proc_trace_enable:
    description:
      "Set to `false` to skip process tracing, which is the only part of the
      action that installs anything (the `forkstat` package) and needs `sudo`.
      Resource metrics are unaffected. Defaults to 'true'."
    default: 'true'
    required: false
  proc_trace_min_duration:
    description:
      "Puts minimum limit for process execution duration to be traced. Must be a
      number. Defaults to '-1' which means process duration filtering is not
      applied."
    default: '-1'
    required: false
  proc_trace_chart_max_count:
    description:
      "Maximum number of processes to be shown in trace chart. Must be a number.
      Defaults to '100'."
    default: '100'
    required: false
  proc_trace_table_show:
    description:
      "Enables showing traced processes in trace table. Defaults to 'false'."
    default: 'false'
    required: false
  comment_on_pr:
    description:
      "Set to `true` to publish the results as comment to the PR (applicable if
      workflow run is triggered from PR). Defaults to 'true'."
    default: 'true'
    required: false
  job_summary:
    description:
      "Set to `true` to publish the results as part of the job summary page of
      the workflow run. Defaults to 'true'."
    default: 'true'
    required: false

runs:
  using: 'node24'
  main: dist/main/index.js
  post: dist/post/index.js
branding:
  icon: 'activity'
  color: 'yellow'
